<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f9f5ed">
<meta name="description" content="Ответь на 7 вопросов и узнай, какой ты персонаж в блоге. Тест Юлии Принц.">
<title>Какой ты персонаж? — Юлия Принц</title>
<style>
:root{color-scheme:light;--ink:#241618;--red:#941b32;--paper:#f9f5ed;--line:#ddc9c5;--white:#fffcf7;font-family:system-ui,sans-serif;background:var(--paper);color:var(--ink)}
*{box-sizing:border-box}
body{margin:0}
header{max-width:980px;margin:auto;padding:21px clamp(20px,5vw,56px);display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);color:var(--red)}
header strong{font:italic bold 1.3rem Georgia,serif}
header span,.eyebrow{font-size:.875rem;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--red)}
main{max-width:980px;margin:auto;padding:clamp(24px,6vw,65px) clamp(16px,5vw,56px) 64px}
h1,h2{font-family:Georgia,serif;line-height:1.06;margin:0;letter-spacing:-.035em}
h1{font-size:clamp(2rem,6vw,3.6rem)}
h2{font-size:clamp(1.8rem,5vw,3.1rem)}
p{line-height:1.6;margin:0 0 1em}
.eyebrow{margin-bottom:14px}
.hero{display:grid;grid-template-columns:1fr 0.85fr;gap:clamp(20px,5vw,50px);align-items:center}
.hero h1{font-size:clamp(3.1rem,8.3vw,6.3rem);color:var(--red);margin-bottom:20px}
.hero p:not(.eyebrow){font-size:1.13rem;max-width:34ch}
.author{margin:0;justify-self:center;width:min(100%,360px);padding:7px;border:1px solid var(--line);background:var(--white)}
.author img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 24%;display:block}
.author figcaption{padding:12px 9px 8px;display:flex;align-items:baseline;flex-wrap:wrap;gap:5px 12px}
.author strong{font:700 1.25rem Georgia,serif;color:var(--red)}
.author span{font-size:.875rem}
.action{display:inline-flex;justify-content:center;align-items:center;background:var(--red);color:#fff;text-decoration:none;border:1px solid var(--red);font:inherit;font-weight:750;border-radius:5px;padding:13px 22px;min-height:48px;cursor:pointer}
.action:hover{background:#731226}.secondary{background:transparent;color:var(--red);border-color:var(--line)}.secondary:hover{background:#f1e3de}
button:focus-visible,a:focus-visible{outline:3px solid #b64b5d;outline-offset:4px}
[tabindex="-1"]:focus{outline:none}
.progress{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:23px;color:var(--red);font-weight:700}
progress{flex:1;min-width:100px;height:8px;appearance:none;border:0;border-radius:20px;overflow:hidden;background:#eadbd5;color:var(--red)}
progress::-webkit-progress-bar{background:#eadbd5}progress::-webkit-progress-value{background:var(--red)}progress::-moz-progress-bar{background:var(--red)}
.card{border:1px solid var(--line);background:var(--white);border-radius:14px;padding:clamp(19px,4vw,40px)}
.options{display:grid;gap:9px;margin-top:24px}
.option{width:100%;border:1px solid var(--line);border-radius:7px;background:transparent;display:flex;align-items:center;gap:13px;cursor:pointer;text-align:left;font:inherit;line-height:1.35;color:var(--ink);padding:11px 13px;min-height:50px}
.option:hover,.option[aria-pressed=true]{background:#f7e8e6;border-color:var(--red)}
.num{color:var(--red);font-weight:760;min-width:23px}
.gallery{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.gallery .option{flex-direction:column;padding:6px;gap:5px}
.gallery img{width:100%;aspect-ratio:87/152;object-fit:cover;display:block;border-radius:3px}
.nav{margin-top:19px}.result{margin:20px 0}.result h2{color:var(--red);margin-bottom:20px}
.example{width:min(100%,490px);height:auto;display:block;margin:12px 0 24px;border-radius:8px}
.invite{border-top:1px solid var(--line);padding-top:22px}.invite ul{padding-left:1.3em;line-height:1.55;margin:0 0 18px}.invite li+li{margin-top:6px}.invite h3{margin:0 0 10px;font:700 1.55rem Georgia,serif}
@media(max-width:680px){.hero{grid-template-columns:1fr}.author{justify-self:start;width:min(100%,320px)}.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

 здесь не скучно.", "Если ты сможешь раскрыть себя, как персонажа, правильно, то будешь собирать многомиллионные охваты, потому что всё, что обладает высокой эмоциональностью, очень привлекательно для людей. Они будут следить за тобой неотрывно, потому что буквально подсядут на дозу эмоций от тебя.", "Ты точно не из тех, кто будет сидеть тихо и «не отсвечивать», а если где-то становится скучно — ты либо оживляешь это место, либо просто уходишь 😅 Точно умеешь зажигать людей вокруг, поднимать настроение и создавать ту самую атмосферу, ради которой к тебе возвращаются снова и снова 🔥"], "image": "data:image/jpeg;base64,/9j/7gAOQWRvYmUAZAAAAAAB/9sAxQASDg4ODg4VDg4VGxISEhQaGRYWGRoeFxkhIRweIx4jISwjHiMhLjMzMy4hPkJCQkI+REREREREREREREREREREARQSEhcUFBcUGh8gHR0dICYuIyMjJjMnKSkpJzM+MzQ0NDQzPjtERERERDtEREREREREREREREREREREREREREQCFBISFxQUFxQaHyAdHR0gJi4jIyMmMycpKSknMz4zNDQ0NDM+O0REREREO0RERERERERERERERERERERERERERP/dAAQALP/AABEIArMCswMAIgABEQECEQL/xAGiAAEAAgMBAQADAQAAAAAAAAAABgcDBAUCAQgJCgsBAQADAQABBQEAAAAAAAAAAAACAwQBBQYHCAkKCxAAAQMCAgUECAgEDD4zAAAAAQACAwQREiEFBjFBURMiYXEyNYGDkaGysxQVI0JSscHRQ3KCkhYkMzRTVGJjc5Oi0gcICQoXGBkaJSYnKCkqNjc4OTpERUZHSElKVVZXWFlaZGVmZ2hpanR1dnd4eXqEhYaHiImKlJWWl5iZmqPxpKWmp6ipqrS1tre4ubrCw8TFxsfIycrT1NXW19jZ2uHi4+Tl5ufo6erw8vP09fb3+Pn6EQEAAQIAAwUFAo8AAAAAAAAAAQIRAyExBBJBYYEiMlFxsRORBQYHCAkKFBUWFxgZGiMkJSYnKCkqMzQ1Njc4OTpCQ0RFRkdISUpSU1RVVldYWVpiY2RlZmdoaWpyc3R1dnd4eXqCg4SFhoeIiYqSk5SVlpeYmZqhoqOkpaanqKmqsrO0tba3uLm6wcLDxMXGx8jJytHS09TV1tfY2drh4uPk5ebn6Onq8PHy8/T19vf4+fr/2gAMAwAAARECEQA/AJwiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiLHNNHBGZJDYDwk8EHp8jY24nmw/65LGJy4XDcPw2R8C1AZJniabK3YR7Q3p6Sst0H2R7iLONxw2LSlnMJDmZFuz3l7nlLBdRrSel+SJijsZDtO5v+ugkGkdNQxaMkmjI5V3qYZcFwcVAyx0srYBmQSXniTmfeXnlpecb4i7PnZ58etdHRkIZBNpKVuPALMaRcFx2INWs5rm0rc+TzdbZiO7uBHjkacN9dJ7Q98r7SwuqJ8Tt5u4lJjy83N7EZNHQNiDxBHYXO1ZXi+QWQMDQvJ5t3+xGQ6dyDBLm8MGxgt3d5Xxzha1uxzPuL2yJxGLukrFJsDd7jc+4gxco7inKO4rLyLU5FqD/ AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/9k="}, {"name": "Свой", "paragraphs": ["Ты по-настоящему простой, живой и «свой» человек. 🌿 Ты точно не из тех, кто будет строить из себя кого-то другого, а рядом с тобой люди чувствуют: «можно выдохнуть и быть собой» 😌 Ты создаёшь ощущение близости и узнавания, из-за которого кажется, будто вы знакомы уже сто лет.", "Твой большой потенциал кроется в умении быть настоящим и очень близким. Люди будут приходить к тебе за ощущением комфорта и понимания. Здесь нет пафоса, поэтому главный триггер, за счет которого растут такие персонажи, как ты — это «этот человек такой же, как я».", "Если ты сможешь раскрыть себя, как персонажа, правильно, то будешь собирать очень лояльную и теплую аудиторию, перед которой не нужно будет притворяться, казаться кем-то другим. Эти люди будут поддерживать тебя и следовать за тобой, чем бы ты ни занимался. А где такая сильная лояльность, там и высокие результаты."], "image": "data:image/jpeg;base64,/9j/7gAOQWRvYmUAZAAAAAAB/9sAxQASDg4WDhYeExkeJyMdGh0jKysrICMtJSc0LyUtNy8yMkIyLzc6QkJCQkI6REREREREREREREREREREREREREREARQSEhcUFBcUGh8gHR0dICYuIyMjJjMnKSkpJzM+MzQ0NDQzPjtERERERDtEREREREREREREREREREREREREREQCFBISFxQUFxQaHyAdHR0gJi4jIyMmMycpKSknMz4zNDQ0NDM+O0REREREO0RERERERERERERERERERERERERERP/dAAQARP/AABEIBDgEOAMAIgABEQECEQL/xAGiAAACAgMBAAMBAAAAAAAAAAAABgQFAQIDBwgJCgsBAQADAQEAAQUAAAAAAAAAAAABAwQCBQYHCAkKCxAAAgECAwMHBQQJBQpvAAAAAAECAxEEEiEFMUEGEyJRYXGRFDKBobFCUsHRFRYjNGJjcrLwQ3OjwuIHCAkkM1NUgpPhChcYGRolJicoKSo1Njc4OTpERUZHSElKVVZXWFlaZGVmZ2hpanR1dnd4eXqDhIWGh4iJipKUlZaXmJmaoqSlpqeoqaqztLW2t7i5usPExcbHyMnK0tPU1dbX2Nna4+Tl5ufo6erx8vP09fb3+Pn6EQEBAAEBAgMEBgiHAAAAAAAAARECAyESMVEEMkGxEzNhcYHBBRQiIyShovAGBwgJChUWFxgZGiUmJygpKjQ1Njc4OTpCQ0RFRkdISUpSU1RVVldYWVpiY2RlZmdoaWpyc3R1dnd4eXqCg4SFhoeIiYqRkpOUlZaXmJmao6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrR0tPU1dbX2Nna4eLj5OXm5+jp6vHy8/T19vf4+fr/2gAMAwAAARECEQA/AHgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA const webinarUrl = 'https://julia-prince.ru/kakoipersonazh?utm_source=voronka&utm_medium=site';
const app = document.getElementById('app');
const answers = [];
let step = 0;

function winnersFor(choices) {
  const counts = types.map(() => 0);
  for (const choice of choices) counts[choice]++;
  const max = Math.max(...counts);
  return types.filter((_, index) => counts[index] === max);
}

function show(html, focus = true) {
  app.innerHTML = html;
  if (focus) {
    window.scrollTo(0, 0);
    app.querySelector('h1').focus();
  }
}

function welcome(focus) {
  show(`<section class="hero"><div><p class="eyebrow">7 вопросов · 6 типов</p>
    <h1 tabindex="-1">Какой ты персонаж?</h1>
    <p>Узнай, чем ты притягиваешь внимание аудитории и на чём можешь построить стратегию своего блога.</p>
    <button class="action" data-action="start">Начать тест</button></div>
    <figure class="author"><img src="${authorPhoto}" alt="Портрет Юлии Принц">
    <figcaption><strong>Юлия Принц</strong><span>Автор теста и метода «Персонаж»</span></figcaption></figure>
    </section>`, focus);
}

function question() {
  const [title, options] = questions[step];
  const visual = step === 1;
  show(`<div class="progress"><span>Вопрос ${step + 1} из ${questions.length}</span>
    <progress aria-label="Отвечено вопросов" value="${step}" max="${questions.length}"></progress></div>
    <section class="card"><h1 tabindex="-1">${title}</h1>
    <div class="options${visual ? ' gallery' : ''}">${options.map((option, i) =>
      `<button type="button" class="option" data-choice="${i}" aria-pressed="${answers[step] === i}">
      ${visual ? `<img src="${pictures[i]}" alt="${option}">` : ''}
      <span class="num"${visual ? ' aria-hidden="true"' : ''}>${i + 1}</span>${visual ? '' : `<span>${option}</span>`}</button>`).join('')}</div>
    </section><div class="nav"><button class="action secondary" data-action="back">Назад</button></div>`);
}

function result() {
  const winners = winnersFor(answers);
  show(`<p class="eyebrow">Твой результат</p>
    <h1 tabindex="-1">${winners.length === 1 ? 'Твой тип персонажа' : 'Твои ведущие типы'}</h1>
    ${winners.length > 1 ? '<p>Эти типы набрали одинаковое количество ответов.</p>' : ''}
    ${winners.map(type => `<article class="card result">
      <h2>${type.name}</h2>
      ${type.paragraphs.map(paragraph => `<p>${paragraph}</p>`).join('')}
      <p><strong>Примеры звёзд этого типа</strong></p>
      <img class="example" src="${type.image}" alt="Коллаж со звёздами типа «${type.name}»">
      <section class="invite"><h3>Как раскрыть своего персонажа в блоге?</h3>
      <p>Приходи на практический эфир Юлии Принц «Какой ты персонаж?». На эфире ты узнаешь:</p>
      <ul>
        <li>В чём сильная сторона твоего типа и за что аудитория будет тебя запоминать.</li>
        <li>Какие темы, форматы и подача помогут раскрыть твой характер в контенте.</li>
        <li>Как использовать метод «Персонаж», чтобы расти в соцсетях и привлекать подписчиков и клиентов.</li>
      </ul>
      <p>После регистрации ты получишь доступ к «Аллее звёзд» — закрытому каналу с разборами известных персонажей и розыгрышем подарков.</p>
      <a class="action" href="${webinarUrl}">Зарегистрироваться на эфир</a></section>
      </article>`).join('')}
    <button class="action secondary" data-action="retry">Пройти ещё раз</button>`);
}

app.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  switch (button.dataset.action) {
    case 'start':
      question();
      return;
    case 'back':
      if (step === 0) welcome(true);
      else { step--; question(); }
      return;
    case 'retry':
      step = 0;
      answers.length = 0;
      welcome(true);
      return;
  }
  if (button.dataset.choice === undefined) return;
  answers[step] = Number(button.dataset.choice);
  step++;
  if (step === questions.length) result();
  else question();
});

welcome(false);
</script>
</html>
